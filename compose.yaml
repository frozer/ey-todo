# Build:           docker compose build
# Run:             docker compose up -d          (migrations run first, then the app)

x-app: &app
  image: ${IMAGE:-ey-todo}:${TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - state:/app/.state

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # DEV drops the Secure cookie flag: only for plain-HTTP testing on a LAN IP
      ENVIRONMENT: ${ENVIRONMENT:-PROD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # behind a TLS-terminating proxy: trust its X-Forwarded-Proto (uvicorn reads this)
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 10s # > uvicorn --timeout-graceful-shutdown 100

volumes:
  state:
